name: Hosted mathematics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.md'
      - '**.markdown'
      - 'verification/hosted/**'
      - '.github/workflows/hosted-math.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHECKED_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the published PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned rendering dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-dependencies" --no-audit --no-fund playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/hosted-dependencies/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare actual GitHub mathematics with its source
        env:
          NODE_PATH: ${{ runner.temp }}/hosted-dependencies/node_modules
        run: |
          node verification/hosted/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$CHECKED_REVISION" \
            --contract verification/hosted/math-contract.json \
            --output "$RUNNER_TEMP/hosted-evidence"
      - name: Retain the actual capture and comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hosted-math-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-evidence/
          if-no-files-found: error
          retention-days: 14
